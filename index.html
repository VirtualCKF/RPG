<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Unity WebGL Player | RPG</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="TemplateData/icon200.png">
    <link rel="icon" type="image/png" sizes="200x200" href="TemplateData/icon200.png">
    <style>
      /* 強制覆寫 Unity 在手機端生成的原生輸入預覽框位置 */
      input[type="text"], input[type="password"], textarea {
        position: fixed !important;
        bottom: auto !important;     /* 取消原本貼在底部的設定 */
        top: 50% !important;         /* 移到畫面中上段（避開手機虛擬鍵盤，40% 比 50% 更安全） */
        left: 50% !important;        /* 移到畫面水平中間 */
        transform: translate(-50%, -50%) !important; /* 精準置中對齊 */
        
        /* 樣式與防縮放優化 */
        width: 85% !important;       /* 寬度佔螢幕的 85% */
        max-width: 600px !important; 
        z-index: 999999 !important;  /* 確保絕對蓋在 Unity 畫布最上層 */
        font-size: 16px !important;  /* 關鍵：iOS 規定大於等於 16px 點擊才不會讓整個網頁畫面突然放大放大 */
        
        /* 視覺微調（可自由調整） */
        padding: 12px !important;
        background-color: #ffffff !important;
        color: #000000 !important;
        border: 2px solid #2196F3 !important; /* 給它一個藍色邊框，確認它在哪 */
        border-radius: 8px !important;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3) !important;
      }

      /* ===== 原生 HTML/CSS Loading 遮罩 ===== */
      #custom-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      /* 自訂 Loading 頁面中的 Unity Logo */
      .custom-loader-logo {
        width: 200px;
        height: 60px;
        background: url('TemplateData/unity-logo-dark.png') no-repeat center;
        background-size: contain;
        margin-bottom: 20px;
      }

      /* 轉圈動畫元件 (保留結構，暫時隱藏) */
      .spinner {
        display: none; /* 【暫時隱藏轉圈】欲恢復請刪除此行或改為 display: block */
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top: 3px solid #FFFFFF;
        border-radius: 50%;
        animation: custom-spin 0.9s linear infinite;
      }

      @keyframes custom-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loader-text {
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        letter-spacing: 0.5px;
      }

      /* 轉圈遮罩專屬的進度條 (Bar) 樣式 */
      .loader-progress-bar-empty {
        width: 200px;
        height: 6px;
        background: #4D4D4D;
        border-radius: 5px;
        overflow: hidden;
        margin-top: 15px;
      }

      .loader-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #FFFFFF;
        border-radius: 5px;
        transition: width 0.2s ease-out;
      }

      #custom-loader.hidden {
        opacity: 0;
        visibility: hidden;
      }

      /* 強制容量/進度顯示文字樣式 */
      .progress-text-style {
        color: #FFFFFF !important;
        font-size: 13px !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        margin-top: 10px !important;
        text-align: center !important;
        width: 100% !important;
        position: relative !important;
        z-index: 100000 !important;
        display: block !important;
        white-space: nowrap !important;
        text-shadow: 0px 1px 3px rgba(0,0,0,0.8);
      }
    </style>
  </head>
  <body>
    <!-- 原生 Loading 遮罩層 -->
    <div id="custom-loader">
      <!-- 新增：顯示 Unity Logo Dark -->
      <div class="custom-loader-logo"></div>
      
      <!-- 保留轉圈元件 (CSS 已設定 display: none 隱藏) -->
      <div class="spinner"></div>

      <div class="loader-text">即將開始冒險...</div>
      
      <!-- 進度條 (Bar) -->
      <div class="loader-progress-bar-empty">
        <div id="custom-loader-progress-bar" class="loader-progress-bar-full"></div>
      </div>
      
      <!-- 容量與進度文字 -->
      <div id="custom-loader-progress" class="progress-text-style">準備載入...</div>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <!-- Unity 原生進度條內部的進度文字 -->
        <div id="unity-progress-text" class="progress-text-style">準備載入...</div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var customLoader = document.querySelector("#custom-loader");

      // 進度條與文字 DOM 節點
      var customProgressBarFull = document.querySelector("#custom-loader-progress-bar");
      var loaderProgress = document.querySelector("#custom-loader-progress");
      var unityProgressText = document.querySelector("#unity-progress-text");

      // 統一更新「所有進度條 BAR 長度」的輔助函式
      function updateProgressBarWidth(percent) {
        if (progressBarFull) progressBarFull.style.width = percent + "%";
        if (customProgressBarFull) customProgressBarFull.style.width = percent + "%";
      }

      // 統一更新「所有進度文字」的輔助函式
      function updateProgressText(str) {
        if (loaderProgress) loaderProgress.innerText = str;
        if (unityProgressText) unityProgressText.innerText = str;
      }

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // --- 【防快取機制 2】自動獲取 Unity 的 Version 版本號並注入 URL 參數 ---
      var unityVersion = "0.1233";
      var buildUrl = "Build";
      
      // 自動在 Loader 的後方加上版號後綴（如 .js?v="0.2"）
      var loaderUrl = buildUrl + "/VirturalRPG_Online_WebGL_1.loader.js?v=" + encodeURIComponent(unityVersion);
      var config = {
        // 自動在所有核心資源檔案後方加上 ?v=版號
        dataUrl: buildUrl + "/VirturalRPG_Online_WebGL_1.data.unityweb?v=" + encodeURIComponent(unityVersion),
        frameworkUrl: buildUrl + "/VirturalRPG_Online_WebGL_1.framework.js.unityweb?v=" + encodeURIComponent(unityVersion),
        codeUrl: buildUrl + "/VirturalRPG_Online_WebGL_1.wasm.unityweb?v=" + encodeURIComponent(unityVersion),
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Failusion Studio",
        productName: "RPG",
        productVersion: "0.1233",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        
        container.className = "unity-mobile";
        loadingBar.style.position = "fixed";
      }

      loadingBar.style.display = "block";

      // 方法二：動態透過 HTTP HEAD 請求獲取檔案總容量 (Bytes)
      async function getTotalFileSize() {
        var urls = [
          config.dataUrl,
          config.frameworkUrl,
          config.codeUrl
        ].filter(Boolean);

        var totalBytes = 0;
        
        try {
          await Promise.all(
            urls.map(async function(url) {
              try {
                var response = await fetch(url, { method: 'HEAD' });
                var size = response.headers.get('content-length');
                if (size) {
                  totalBytes += parseInt(size, 10);
                }
              } catch (e) {
                // 若個別檔案被 CORS 或 HEAD 限制擋掉則靜默跳過
              }
            })
          );
        } catch (e) {}

        return totalBytes;
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = async function() {
        updateProgressText("正在計算容量...");
        
        // 獲取總容量
        var totalBytes = await getTotalFileSize();
        var totalMB = totalBytes > 0 ? (totalBytes / (1024 * 1024)).toFixed(2) : 0;

        createUnityInstance(canvas, config, function(progress) {
          // 1. 同步更新所有進度條 (BAR) 長度
          updateProgressBarWidth(100 * progress);

          // 2. 計算並更新 MB 進度文字
          if (totalBytes > 0) {
            var loadedMB = ((progress * totalBytes) / (1024 * 1024)).toFixed(2);
            updateProgressText(loadedMB + " MB / " + totalMB + " MB");
          } else {
            // 安全保底：若伺服器未提供 Content-Length，顯示百分比
            updateProgressText(Math.round(progress * 100) + "%");
          }

          // 進度到達 98% 以上時淡出原生的轉圈遮罩
          if (progress > 0.98 && customLoader) {
            customLoader.classList.add("hidden");
          }
        }).then(function(unityInstance) {
          loadingBar.remove(); 
          if (customLoader) {
            customLoader.classList.add("hidden");
          }
        }).catch(function(message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
